<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Midnight Obsidian -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161824" />
      <stop offset="100%" stop-color="#0b0c12" />
    </linearGradient>

    <!-- Coral Fire Gradient -->
    <linearGradient id="coralAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff765e" />
      <stop offset="100%" stop-color="#e85d4a" />
    </linearGradient>

    <!-- Warm Golden Light -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d496" />
      <stop offset="100%" stop-color="#c8a96e" />
    </linearGradient>

    <!-- Premium Rim Light -->
    <linearGradient id="rimLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="40%" stop-color="#e85d4a" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>

    <!-- Soft Ambient Glow -->
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#e85d4a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="20" y="20" width="472" height="472" rx="118" fill="url(#bgGrad)" />
  <rect x="20" y="20" width="472" height="472" rx="118" fill="none" stroke="url(#rimLight)" stroke-width="6" />

  <!-- Shopping Bag Structure (Modern Luxury Minimalist) -->
  <!-- Bag Handle: Refined, perfectly centered arch -->
  <path d="M 196 170 
           V 135 
           C 196 95, 316 95, 316 135 
           V 170" 
        fill="none" 
        stroke="url(#coralAccent)" 
        stroke-width="26" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Bag Body: Elegant trapezoidal taper with rounded corners -->
  <path d="M 140 180 
           H 372 
           L 352 400 
           C 350 416, 336 428, 320 428 
           H 192 
           C 176 428, 162 416, 160 400 
           Z" 
        fill="#ffffff" 
        filter="url(#badgeGlow)" />

  <!-- Inner Bag Fold / Detail -->
  <path d="M 140 180 L 160 400" stroke="#f1f0ee" stroke-width="3" fill="none" />
  <path d="M 372 180 L 352 400" stroke="#e2dfd9" stroke-width="3" fill="none" />

  <!-- Bold Luxury Cutout 'S' inside the Bag -->
  <!-- Top bar / upper loop of S -->
  <path d="M 292 245 
           C 285 230, 268 222, 248 222 
           C 225 222, 208 236, 208 254 
           C 208 272, 222 282, 246 290 
           L 262 295 
           C 294 306, 314 322, 314 348 
           C 314 378, 286 398, 248 398 
           C 214 398, 192 380, 186 358" 
        fill="none" 
        stroke="#161824" 
        stroke-width="28" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- The Shoplex Signature Coral Accent Tag / Dot at top right -->
  <circle cx="340" cy="205" r="16" fill="url(#coralAccent)" />
  <circle cx="340" cy="205" r="8" fill="#ffffff" opacity="0.8" />
</svg>
